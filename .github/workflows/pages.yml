name: Sincronizar ambiente público do Cronômetro

on:
  push:
    branches: ["development", "stable"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "cronometro-publicacao-main"
  cancel-in-progress: false

jobs:
  build-and-sync-main:
    runs-on: ubuntu-latest
    steps:
      - name: Determinar ambiente autorizado pelo branch
        run: |
          case "${GITHUB_REF_NAME}" in
            development) echo "PUBLICATION_TARGET=beta" >> "$GITHUB_ENV" ;;
            stable) echo "PUBLICATION_TARGET=official" >> "$GITHUB_ENV" ;;
            *) echo "Branch sem ambiente público autorizado: ${GITHUB_REF_NAME}" >&2; exit 1 ;;
          esac

      - name: Checkout da main que o Pages realmente publica
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Checkout somente da fonte acionadora
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          path: _source
          fetch-depth: 0
          persist-credentials: false

      - name: Carregar release do ambiente acionado
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, os
          env=json.load(open('_source/environments.json', encoding='utf-8'))
          target=os.environ['PUBLICATION_TARGET']
          if target=='beta':
              print('PUBLICATION_RELEASE='+env['beta']['release'])
          elif target=='official':
              print('PUBLICATION_RELEASE='+env['official']['release'])
          else:
              raise SystemExit('Ambiente de publicação inválido')
          PY

      - name: Preparar ferramentas de ícone
        run: python3 -m pip install --disable-pip-version-check --quiet pillow

      - name: Montar somente a Beta a partir de development
        if: env.PUBLICATION_TARGET == 'beta'
        run: |
          python3 _source/prepare_beta_icon.py
          python3 _source/prepare_release.py _source _source/_release_source "${PUBLICATION_RELEASE}"
          python3 _source/prepare_isolated_publication.py build-beta \
            --source _source/_release_source \
            --output _source/_publication_beta \
            --release "${PUBLICATION_RELEASE}"

      - name: Montar somente a Oficial a partir de stable
        if: env.PUBLICATION_TARGET == 'official'
        run: |
          python3 _source/prepare_release.py _source _source/_release_source "${PUBLICATION_RELEASE}"
          python3 _source/prepare_isolated_publication.py build-official \
            --source _source/_release_source \
            --public . \
            --output _source/_publication_official \
            --release "${PUBLICATION_RELEASE}"

      - name: Validar e sincronizar exclusivamente o ambiente acionado
        run: |
          if [ "${PUBLICATION_TARGET}" = beta ]; then
            python3 _source/prepare_isolated_publication.py sync-beta \
              --built _source/_publication_beta \
              --public .
          else
            python3 _source/prepare_isolated_publication.py sync-official \
              --candidate _source/_publication_official \
              --public .
          fi
          rm -rf _source

      - name: Provar isolamento no diff preparado
        run: |
          git add -A
          python3 - <<'PY'
          import os, subprocess
          target=os.environ['PUBLICATION_TARGET']
          changed=[line for line in subprocess.check_output(
              ['git','diff','--cached','--name-only','-z']
          ).decode().split('\0') if line]
          if target=='beta':
              invalid=[path for path in changed if not path.startswith('beta/')]
              if invalid:
                  raise SystemExit('Publicação Beta tentou alterar a Oficial: '+', '.join(invalid))
          else:
              invalid=[path for path in changed if path.startswith('beta/')]
              if invalid:
                  raise SystemExit('Publicação Oficial tentou alterar a Beta: '+', '.join(invalid))
          print(f'Isolamento confirmado para {target}: {len(changed)} arquivo(s) alterado(s).')
          PY

      - name: Confirmar pacote público resultante
        run: |
          test -s index.html
          test -s beta/index.html
          grep -q "const DB_NAME='cronometro_local_v1';" cronometro-v080-01.js
          grep -q "const DB_NAME='cronometro_beta_v1';" beta/cronometro-v080-01.js
          ! grep -q "const DB_NAME='cronometro_local_v1';" beta/cronometro-v080-01.js
          if [ "${PUBLICATION_TARGET}" = beta ]; then
            grep -q "${PUBLICATION_RELEASE}" beta/version.json
            grep -q 'cronometro-v092-advanced-analytics.js' beta/index.html
            ! grep -q 'analytics-ui.js' beta/index.html
          else
            grep -q "${PUBLICATION_RELEASE}" version.json
          fi

      - name: Gravar somente o ambiente autorizado na main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Nenhuma alteração pública pendente para ${PUBLICATION_TARGET}."
          else
            git commit -m "chore(pages): publica ${PUBLICATION_TARGET} isoladamente [skip ci]"
            git push origin main
          fi
