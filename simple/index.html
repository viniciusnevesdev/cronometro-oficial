  <style id="beta-timer-title-row-alignment">
    #app .timer-card:not(.central) .name{
      display:flex!important;
      align-items:center!important;
      justify-content:flex-start!important;
      gap:5px!important;
      text-align:left!important;
      line-height:1.15!important;
    }
    #app .timer-card:not(.central) .name .beta-standard-timer-icon{
      margin:0!important;
      vertical-align:middle!important;
      flex:0 0 auto!important;
    }
    #app .timer-card .name .beta-standard-timer-icon-mask[style*="estrutura.svg"]{
      width:39px!important;
      height:39px!important;
    }

    /* Médio: duas áreas independentes para não comprimir/cortar o título. */
    body[data-timer-mode="medium"] #app .timer-card:not(.central){
      position:relative!important;
      display:block!important;
      min-height:118px!important;
      height:118px!important;
      padding:0!important;
      overflow:hidden!important;
    }
    body[data-timer-mode="medium"] #app .timer-card:not(.central)>.name{
      position:absolute!important;
      left:18px!important;
      right:18px!important;
      top:13px!important;
      width:auto!important;
      max-width:none!important;
      min-width:0!important;
      height:auto!important;
      margin:0!important;
      padding:0!important;
      display:block!important;
      text-align:center!important;
      line-height:20px!important;
      white-space:nowrap!important;
      overflow:hidden!important;
      text-overflow:ellipsis!important;
      transform:none!important;
    }
    body[data-timer-mode="medium"] #app .timer-card:not(.central)>.name>.beta-standard-timer-icon{
      display:none!important;
    }
    body[data-timer-mode="medium"] #app .timer-card:not(.central)>.icon{
      position:absolute!important;
      left:18px!important;
      top:61px!important;
      width:42px!important;
      height:42px!important;
      margin:0!important;
      display:grid!important;
      place-items:center!important;
      transform:none!important;
    }
    body[data-timer-mode="medium"] #app .timer-card:not(.central)>.beta-medium-bottom-row{
      position:absolute!important;
      left:50%!important;
      top:52px!important;
      transform:translateX(-50%)!important;
      display:flex!important;
      align-items:center!important;
      justify-content:center!important;
      gap:12px!important;
      width:max-content!important;
      max-width:calc(100% - 128px)!important;
      height:58px!important;
      margin:0!important;
      padding:0!important;
      pointer-events:none!important;
    }
    body[data-timer-mode="medium"] #app .timer-card:not(.central)>.beta-medium-bottom-row>.beta-medium-timer-icon{
      display:block!important;
      width:48px!important;
      height:48px!important;
      min-width:48px!important;
      margin:0!important;
      line-height:0!important;
      opacity:.85!important;
      flex:0 0 auto!important;
    }
    body[data-timer-mode="medium"] #app .timer-card:not(.central)>.beta-medium-bottom-row>.beta-medium-timer-icon svg{
      display:block!important;
      width:100%!important;
      height:100%!important;
      overflow:visible!important;
      fill:currentColor!important;
    }
    body[data-timer-mode="medium"] #app .timer-card:not(.central)>.beta-medium-bottom-row>.beta-medium-timer-icon.beta-standard-timer-icon-mask{
      background:currentColor!important;
      -webkit-mask-repeat:no-repeat!important;
      mask-repeat:no-repeat!important;
      -webkit-mask-position:center!important;
      mask-position:center!important;
      -webkit-mask-size:contain!important;
      mask-size:contain!important;
    }
    body[data-timer-mode="medium"] #app .timer-card:not(.central)>.beta-medium-bottom-row>.beta-medium-timer-icon.beta-primer-timer-icon,
    body[data-timer-mode="medium"] #app .timer-card:not(.central)>.beta-medium-bottom-row>.beta-medium-timer-icon.beta-standard-timer-icon-mask[style*="estrutura.svg"]{
      width:58px!important;
      height:58px!important;
      min-width:58px!important;
    }
    body[data-timer-mode="medium"] #app .timer-card:not(.central)>.beta-medium-bottom-row>.time{
      position:static!important;
      display:block!important;
      width:auto!important;
      min-width:0!important;
      margin:0!important;
      padding:0!important;
      transform:none!important;
      text-align:left!important;
      font-size:42px!important;
      line-height:1!important;
      white-space:nowrap!important;
      flex:0 0 auto!important;
    }
  </style>

  <script id="beta-medium-timer-layout">
  (()=>{
    const app=document.getElementById('app');
    if(!app)return;
    let syncing=false;
    const restoreCard=card=>{
      const row=card.querySelector(':scope>.beta-medium-bottom-row');
      if(!row)return;
      const time=row.querySelector(':scope>.time');
      if(time)card.appendChild(time);
      row.remove();
    };
    const sync=()=>{
      if(syncing)return;
      syncing=true;
      try{
        const medium=document.body.dataset.timerMode==='medium';
        app.querySelectorAll('.timer-card:not(.central)').forEach(card=>{
          const name=card.querySelector(':scope>.name');
          if(!name)return;
          if(!medium){restoreCard(card);return;}
          let row=card.querySelector(':scope>.beta-medium-bottom-row');
          let time=card.querySelector(':scope>.time') || row?.querySelector(':scope>.time');
          if(!time)return;
          if(!row){
            row=document.createElement('span');
            row.className='beta-medium-bottom-row';
            row.setAttribute('aria-hidden','true');
            card.appendChild(row);
          }
          const source=name.querySelector(':scope>.beta-standard-timer-icon');
          let visual=row.querySelector(':scope>.beta-medium-timer-icon');
          if(source&&!visual){
            visual=source.cloneNode(true);
            visual.classList.add('beta-medium-timer-icon');
            visual.setAttribute('aria-hidden','true');
            row.appendChild(visual);
          }
          if(time.parentElement!==row)row.appendChild(time);
        });
      }finally{syncing=false;}
    };
    sync();
    new MutationObserver(sync).observe(app,{childList:true,subtree:true});
    new MutationObserver(sync).observe(document.body,{attributes:true,attributeFilter:['data-timer-mode']});
    window.addEventListener('pageshow',sync);
  })();
  </script>
  <script src="./presentation-ui.js"></script>
  <script src="./analytics-ui.js"></script>
  <script src="./simple-mode.js"></script>
